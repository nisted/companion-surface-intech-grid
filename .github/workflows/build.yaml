name: Build

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: corepack enable

      - name: Build Intech Grid surface module
        run: |
          yarn install --no-immutable
          yarn package

      - name: Build patched SQ module
        working-directory: sq
        run: |
          yarn install --no-immutable
          yarn package

      - name: Collect both module packages
        run: |
          mkdir -p out
          cp *.tgz sq/*.tgz out/
          echo "::notice::Packages: $(ls out | tr '\n' ' ')"

      - uses: actions/upload-artifact@v4
        with:
          name: companion-nige-modules
          path: out/*.tgz
          if-no-files-found: error

      - name: Lint (informational)
        run: yarn lint || true

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.tgz
