name: Build

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: corepack enable

      - name: Build Intech Grid surface module
        run: |
          yarn install --no-immutable
          yarn package

      - name: Build patched SQ module
        working-directory: sq
        run: |
          yarn install --no-immutable
          yarn package

      - name: Combine into one offline module bundle
        run: |
          set -e
          mkdir -p bundle/nige-modules
          echo "::notice::Packages found: $(ls *.tgz sq/*.tgz 2>&1 | tr '\n' ' ')"
          for pkg in $(ls *.tgz sq/*.tgz); do
            echo "::notice::Adding $pkg"
            rm -rf work && mkdir work && tar -xzf "$pkg" -C work
            manifest=$(find work -maxdepth 3 -path '*/companion/manifest.json' | head -1)
            [ -n "$manifest" ] || { echo "::error::No manifest in $pkg: $(tar -tzf "$pkg" | head -5 | tr '\n' ' ')"; exit 1; }
            root=$(dirname "$(dirname "$manifest")")
            id=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1])).id)" "$manifest")
            mv "$root" "bundle/nige-modules/$id"
          done
          ls bundle/nige-modules
          tar -czf companion-nige-modules-bundle.tgz -C bundle nige-modules
          tar -tzf companion-nige-modules-bundle.tgz | grep manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: companion-nige-modules-bundle
          path: companion-nige-modules-bundle.tgz
          if-no-files-found: error

      - name: Lint (informational)
        run: yarn lint || true

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: companion-nige-modules-bundle.tgz
